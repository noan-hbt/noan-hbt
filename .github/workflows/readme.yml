# Keeps the "N public repositories" count of the README up to date.
# Runs every day; rebuilds and commits the images only when the count changed.
name: Update README

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count public repositories
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "users/${{ github.repository_owner }}" --jq .public_repos)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "$(cat scripts/repo-count.txt)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$count" > scripts/repo-count.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.count.outputs.changed == 'true'
        with:
          node-version: 20

      - name: Rebuild images
        if: steps.count.outputs.changed == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/build.mjs

      - name: Commit
        if: steps.count.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/repo-count.txt assets
          git commit -m "Update public repository count (${{ steps.count.outputs.count }})"
          git push
